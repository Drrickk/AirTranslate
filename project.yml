name: AirTranslate
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 26.0
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    from: 3.31.3
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers.git
    from: 1.3.0
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface.git
    from: 0.9.0
targets:
  AirTranslate:
    type: application
    platform: iOS
    sources:
      - path: AirTranslate
    dependencies:
      - package: MLXLM
        product: MLXLLM
      - package: MLXLM
        product: MLXLMCommon
      - package: MLXLM
        product: MLXHuggingFace
      - package: SwiftTransformers
        product: Hub
      - package: SwiftTransformers
        product: Tokenizers
      - package: SwiftHuggingFace
        product: HuggingFace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.airtranslate
        PRODUCT_NAME: AirTranslate
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "离线同传"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "用于实时听取现场讲话并在设备端转写和翻译。"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "用于将语音转成文字；支持设备端离线识别。"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
