name: AirTranslate
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 26.0
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  AirTranslate:
    type: application
    platform: iOS
    sources:
      - path: AirTranslate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.airtranslate
        PRODUCT_NAME: AirTranslate
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "离线同传"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "用于实时听取现场讲话并在设备端转写和翻译。"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "用于将语音转成文字；支持设备端离线识别。"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
